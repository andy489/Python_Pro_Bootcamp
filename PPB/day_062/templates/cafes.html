{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-sm-12">

            <h1 class="mt-3">All Cafes</h1>

            <table class="table table-dark table-striped table-hover">
                {% for row in cafes %}
                <tr>
                    {% for item in row %}
                        {% if item.startswith("http") %}
                            <td><a href="{{ item }}" target="_blank" class="link">Maps Link</a></td>
                        {% else %}
                            <td>{{ item }}</td>
                        {% endif %}
                    {% endfor %}
                </tr>
                {% endfor %}
            </table>

            <div class="d-flex justify-content-between">
                <a href="{{ url_for('home') }}" class="link">Return to index page</a>
                <a href="{{ url_for('add_cafe') }}" class="link">Add cafe</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
