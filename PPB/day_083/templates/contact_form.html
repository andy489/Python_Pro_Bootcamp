<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrey's Portfolio - Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/media-450px.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/media-580px.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/media-768px.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/media-1024px.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/media-1250px.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}"/>

    <style>
        /* Override to only show contact page */
        article { display: none !important; }
        article.contact { display: block !important; }

        /* Make sure navbar shows contact as active */
        .navbar-link[data-nav-link="contact"] {
            color: var(--orange-yellow-crayola) !important;
        }

        /* Ensure main layout works */
        main { margin: 15px 12px; margin-bottom: 75px; }
        .main-content { padding-top: 0; }

        /* Make sure contact form is visible */
        .contact-form { display: block !important; }
    </style>
</head>
<body>
<main>
    {% include 'partials/sidebar.html' %}

    <div class="main-content">
        {% include 'partials/navigation.html' %}

        <!-- Only show contact section -->
        <article class="contact active" data-page="contact">
            <header>
                <h2 class="h2 article-title">Contact</h2>
            </header>

            <section class="mapbox" data-mapbox>
                <figure>
                    <iframe width="600"
                            height="450"
                            style="border:0;"
                            src="https://maps.google.com/maps?q=Sofia%20tech%20Park&t=m&z=14&ie=UTF8&iwloc=&output=embed"
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </figure>
            </section>

            <section class="contact-form">
                <h3 class="h3 form-title">Contact Form</h3>

                <!-- Add Flash Messages Section -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}"
                     style="margin: 10px 0; padding: 10px; border-radius: 5px;
                                    {% if category == 'success' %}
                                        background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                                    {% elif category == 'error' %}
                                        background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                                    {% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('contact') }}" class="form" data-form>
                    <div class="input-wrapper">
                        <input type="text" name="fullname" class="form-input" placeholder="Full name" required
                               value="{{ form_data.fullname if form_data and form_data.fullname else '' }}">
                        <input type="email" name="email" class="form-input" placeholder="Email Address" required
                               value="{{ form_data.email if form_data and form_data.email else '' }}">
                    </div>

                    <textarea name="message" class="form-input" placeholder="Your Message" required>{{ form_data.message if form_data and form_data.message else '' }}</textarea>

                    <button class="form-btn" type="submit" data-form-btn>
                        <i class="fas fa-paper-plane"></i>
                        <span>Send Message</span>
                    </button>
                </form>
            </section>
        </article>
    </div>
</main>

<!-- Simplified JavaScript just for form validation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Contact form page loaded');

    // Form validation
    const form = document.querySelector('[data-form]');
    const formBtn = document.querySelector('[data-form-btn]');

    if (form && formBtn) {
        const formInputs = form.querySelectorAll('input, textarea');

        formInputs.forEach(input => {
            input.addEventListener('input', function () {
                if (form.checkValidity()) {
                    formBtn.removeAttribute('disabled');
                } else {
                    formBtn.setAttribute('disabled', '');
                }
            });
        });

        // Check initial state
        if (form.checkValidity()) {
            formBtn.removeAttribute('disabled');
        } else {
            formBtn.setAttribute('disabled', '');
        }
    }

    // Make contact nav link active
    const contactNavLink = document.querySelector('.navbar-link[data-nav-link="contact"]');
    if (contactNavLink) {
        contactNavLink.classList.add('active');
        console.log('Contact nav link activated');
    }

    // Remove active class from other nav links
    document.querySelectorAll('.navbar-link').forEach(link => {
        if (link !== contactNavLink) {
            link.classList.remove('active');
        }
    });
});
</script>
</body>
</html>
